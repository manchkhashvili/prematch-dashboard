<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cross-book — Prematch Dashboard</title>
  <link rel="stylesheet" href="/style.css?v=20260527c" />
  <script src="/theme.js?v=20260527"></script>
</head>
<body>
  <header>
    <h1>Prematch Dashboard</h1>
    <nav>
      <a href="/matches.html">Matches</a>
      <a href="/arbs.html">Arbs / +EV</a>
      <a href="/cross-book.html" class="active">Cross-book</a>
      <a href="/moves.html">Top Moves</a>
      <a href="/anomalies.html">Anomalies</a>
      <a href="/bets.html">Bets</a>
      <a href="/calc.html">Calc</a>
      <a href="/unmatched.html">Unmatched</a>
    </nav>
    <div class="status" id="status">
      <span id="pin-status">Pin —</span>
    </div>
  </header>

  <div class="controls">
    <div class="chip-group" id="kind-filter" title="+EV = best book beats Pinnacle fair. Arb = best opposing prices across books lock a profit.">
      <span class="chip on" data-kind="all">All</span>
      <span class="chip"    data-kind="ev">+EV</span>
      <span class="chip"    data-kind="arb">Arb</span>
    </div>
    <label>
      Min edge %
      <input type="number" id="min-edge" value="0" step="0.5" />
    </label>
    <span class="row-count" id="row-count">…</span>
    <span class="hint" style="opacity:.7; font-size:.85em;">
      best price across your books per market · +EV vs Pinnacle devig · arb = lock across books
    </span>
  </div>

  <div class="table-wrap">
    <table id="grid">
      <thead>
        <tr>
          <th>Start (UTC)</th>
          <th>Sport</th>
          <th>League</th>
          <th>Match</th>
          <th>Market</th>
          <th>Side</th>
          <th class="num">Lider</th>
          <th class="num">Betlive</th>
          <th class="num">CB</th>
          <th class="num" title="Pinnacle no-vig fair price for this side (the reference)">Pin fair</th>
          <th>Best</th>
          <th class="num" title="Best book's edge vs Pinnacle fair (best_odds / pin_fair − 1)">Edge%</th>
          <th title="Best opposing prices across books lock a guaranteed profit">Arb</th>
        </tr>
      </thead>
      <tbody id="grid-body">
        <tr><td colspan="13" class="empty">loading…</td></tr>
      </tbody>
    </table>
  </div>

<script>
const POLL_MS = 30_000;
let cache = [];
let kindFilter = "all";
const minEdgeInput = document.getElementById("min-edge");
const BOOKS = ["liderbet", "betlive", "cb"];

document.querySelectorAll("#kind-filter .chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll("#kind-filter .chip").forEach(c => c.classList.remove("on"));
    chip.classList.add("on");
    kindFilter = chip.dataset.kind;
    fetchAndRender();
  });
});
minEdgeInput.addEventListener("change", fetchAndRender);

function fmtNum(v, d = 2) {
  return (v === null || v === undefined) ? "—" : Number(v).toFixed(d);
}
function fmtPct(v) {
  if (v === null || v === undefined) return "—";
  return (v >= 0 ? "+" : "") + Number(v).toFixed(2) + "%";
}
function pctClass(v) {
  if (v === null || v === undefined) return "";
  if (v >= 2)  return "edge-pos-bold";
  if (v > 0)   return "edge-pos";
  return "edge-neg";
}
function fmtTime(iso) {
  if (!iso) return "—";
  return new Date(iso).toISOString().slice(5, 16).replace("T", " ");
}
function sportPrefix(s) {
  if (s === "basketball") return "bb";
  if (s === "soccer")     return "sc";
  if (s === "tennis")     return "tn";
  return (s || "").slice(0, 2);
}

async function pollStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    const parts = [];
    let anyErr = false;
    for (const [sport, st] of Object.entries(s.sports || {})) {
      const p = st.pin;
      parts.push(`${sportPrefix(sport)}:${p.count}`);
      if (p.error) anyErr = true;
    }
    const el = document.getElementById("pin-status");
    el.textContent = "Pin " + parts.join(" | ");
    el.className = anyErr ? "err" : "ok";
  } catch (e) { /* ignore */ }
}

async function fetchAndRender() {
  const minEdge = parseFloat(minEdgeInput.value || "0");
  const params = new URLSearchParams({ min_edge: minEdge });
  if (kindFilter !== "all") params.set("kind", kindFilter);
  try {
    cache = await (await fetch("/api/cross_book?" + params.toString())).json();
    render();
  } catch (e) {
    document.getElementById("grid-body").innerHTML =
      `<tr><td colspan="13" class="empty">error loading cross-book grid</td></tr>`;
  }
}

function render() {
  const body = document.getElementById("grid-body");
  document.getElementById("row-count").textContent =
    `${cache.length} row${cache.length === 1 ? "" : "s"}`;
  if (cache.length === 0) {
    body.innerHTML = `<tr><td colspan="13" class="empty">no cross-book rows — enable LIDERBET=1 / BETLIVE=1 and wait for the first poll</td></tr>`;
    return;
  }
  body.innerHTML = cache.map(o => {
    const bookCells = BOOKS.map(b => {
      const px = o.prices[b];
      if (px === undefined) return `<td class="num dim">—</td>`;
      const isBest = b === o.best_book;
      const edge = o.edges ? o.edges[b] : null;
      const title = edge != null ? `edge vs Pin ${fmtPct(edge)}` : "";
      return `<td class="num${isBest ? ' best-book' : ''}" title="${title}">${fmtNum(px, 2)}</td>`;
    }).join("");
    const arbBadge = (o.arb_pct != null)
      ? `<span class="kind kind-arb" title="Lock across books">${fmtPct(o.arb_pct)}</span>`
      : "—";
    return `
      <tr>
        <td class="mono dim">${fmtTime(o.start_time)}</td>
        <td class="dim">${o.sport || ""}</td>
        <td class="dim">${o.league || ""}</td>
        <td>${o.match_label || ""}</td>
        <td class="dim">${o.market || ""}</td>
        <td>${o.side || ""}</td>
        ${bookCells}
        <td class="num dim">${fmtNum(o.pin_fair, 3)}</td>
        <td><strong>${o.best_book || ""}</strong></td>
        <td class="num ${pctClass(o.best_edge_pct)}">${fmtPct(o.best_edge_pct)}</td>
        <td>${arbBadge}</td>
      </tr>`;
  }).join("");
}

fetchAndRender();
pollStatus();
setInterval(fetchAndRender, POLL_MS);
setInterval(pollStatus, POLL_MS);
</script>
</body>
</html>
