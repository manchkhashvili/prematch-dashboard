name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Playwright is in requirements for the optional browser transport, but
      # the default is CB_TRANSPORT=http and no test drives a browser — so the
      # package is installed while its ~400 MB of browser binaries are not.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite is offline by design: every scraper test runs against saved
      # fixtures in data/raw. Unsetting the key proves that stays true — with
      # no PINNACLE_API_KEY and no network, a test that quietly reached the
      # live API would fail here rather than in production.
      - name: Run tests
        env:
          PINNACLE_API_KEY: ""
        run: python -m pytest -q
