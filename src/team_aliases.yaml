# CrystalBet ↔ Pinnacle team name aliases
#
# CB and Pinnacle don't always use the same name for the same team:
#   - CB says "Connecticut", Pinnacle says "Connecticut Sun"
#   - CB transliterates Georgian/Russian differently from Pinnacle
#   - CB sometimes carries the full Italian club name with year
#     ("Pallacanestro Trieste 2004"), Pinnacle uses the short form ("Trieste")
#
# The matcher applies these aliases (case-insensitive on the key) BEFORE
# the unicode-strip → lowercase → token-drop pipeline. Both CB and
# Pinnacle names go through the same alias map, so as long as both sides
# converge on the same canonical form after aliasing, the match works.
#
# ─────────────────────────────────────────────────────────────────────
# How to curate
# ─────────────────────────────────────────────────────────────────────
#  1. Edit this file while the server is running — the matcher reloads
#     it on every poll cycle (mtime cache). No restart needed.
#  2. Open the Unmatched page in the dashboard (or read
#     data/unmatched_log.csv). Each unmatched CB event shows its
#     best Pinnacle candidate and the similarity score.
#  3. Anything in the 60–79 range is usually fixable with an alias —
#     same teams, different name format.
#  4. Anything <50 likely doesn't have a Pinnacle counterpart at all
#     (CB carries the league, Pinnacle doesn't). Skip those.
#  5. Add the alias here, watch the match rate move in the dashboard
#     header, repeat.
#
# YAML format: `source_name: canonical_name`. Quotes around either side
# are only needed when the name contains a colon, hash, or starts with
# a special character. When in doubt, quote.

aliases:
  # ── WNBA — CB drops the franchise suffix ────────────────────────────
  "Connecticut": "Connecticut Sun"
  "Phoenix": "Phoenix Mercury"

  # ── Brazil — initialism vs full name (2026-07-28 unmatched-log audit) ─
  # "CR Brasil AL" vs Pinnacle "CRB" fuzzy-scores 26.7, far below the
  # never-accept floor. The generic initialism bridge in matcher.py can't
  # reach it either: it would have to drop the "AL" state suffix, and
  # dropping tokens is exactly the loosening that invents fixtures. An
  # exact alias is the safe mechanism for a one-off like this.
  "CR Brasil AL": "CRB"
  "CR Brasil": "CRB"

  # ── American football (2026-08-12 board audit) ──────────────────────
  # CB appends the MASCOT to the school ("Rutgers Scarlet Knights") where
  # Pinnacle uses the bare school ("Rutgers"). That alone needs no alias —
  # token_set_ratio scores the pair 100 because the Pinnacle side is a
  # subset. Only two things actually break the join, and each entry below
  # was confirmed by its OPPONENT matching in the same fixture:
  #   (a) the school itself is an initialism or a different word entirely
  #       ("Umass Minutemen" vs "Massachusetts" scores 28.6);
  #   (b) CB has a typo in the school name.
  # NCAA teams Pinnacle does not currently carry are deliberately NOT
  # listed — that is a coverage gap, not a naming one, and inventing an
  # alias for an absent counterpart can only create a wrong match later.
  # "Knights" (CB ships the bare mascot on one NCAA fixture) is likewise
  # left alone: it is ambiguous between UCF and Rutgers.
  "Umass Minutemen": "Massachusetts"          # UMass; Pin 'Massachusetts'
  "Fiu Panthers": "Florida International"     # FIU; opponent 'South Florida' matched
  "St. Wolfpack": "NC State"                  # CB truncated 'N.C. State Wolfpack'
  "Louisiana-Monroe Warhawks": "UL Monroe"
  # CB typos — verified against the fixture's other side
  "Tusla Golden Hurricane": "Tulsa"           # 'Tusla' -> Tulsa
  "Lousville Cardinals": "Louisville"
  "Stenford Cardinal": "Stanford"
  "Norh Dakota State Bison": "North Dakota State"
  # Betlive still carries the CFL team's pre-2021 name
  "Edmonton Eskimos": "Edmonton Elks"

  # ── Chile, Liga Nacional (2026-08-12) ───────────────────────────────────
  # CB abbreviates the club to its mascot + city and misspells the city
  # ("Kilpue" for Quilpué). Against Pinnacle's "CD Colegio Los Leones" that
  # leaves 'kilpue' as a distinctive leftover token agreeing with nothing, so
  # the same-city-different-club guard in matcher.py demands a mean of 88 and
  # the pair (81.6) is rejected — CB never reaches Pinnacle for this fixture
  # while Lider-Bet, which spells the club out, matches at 100. Confirmed the
  # same fixture three ways: identical kickoff, an exact home-side match, and
  # Lider's own name for the club.
  "Leones Kilpue": "CD Colegio Los Leones de Quilpue"

  # ── Examples — uncomment + edit when you observe these mismatches ───
  # Italian Serie A — CB carries full club name with founding year
  # "Pallacanestro Trieste 2004": "Trieste"
  # "Juvecaserta 2021": "Juvecaserta"
  # "Rucker San Vendemiano": "San Vendemiano"
  # "Virtus Gvm Roma 1960": "Virtus Roma"
  # "Skalijera Verona": "Verona"

  # VTB / Russian leagues — transliteration differences
  # "Zenit": "Zenit Saint Petersburg"
  # "UNICS": "UNICS Kazan"

  # Adriatic / Balkans
  # "BC Kalev/Cramo": "Kalev"
